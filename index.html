/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio.
   Put this @layer first; product CSS outside the layer always wins. */
@layer od-layout {
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

  /* containers */
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

  /* stacked information: each piece is its own line — never sibling inline spans */
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }

  /* media keeps its intrinsic ratio by default; never a distorted or cropped
     cover by accident. height:auto lets the ratio win over an <img height="…">
     attribute. Cropping to a uniform box is an explicit opt-in: set --od-ratio
     AND add .od-media-cover together (per the core rule, only where a crop is
     deliberate — tile thumbs, decorative fills — never on full-frame content). */
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }

  /* data text only — authored copy is rewritten to its budget instead */
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }   /* block-level reservation for a shared baseline */
  .od-nowrap  { white-space: nowrap; }           /* 数字+单位 · 价格+起 · 日期+星期 */
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; } /* CJK labels break at spaces / <wbr> first */

  /* screen skeleton (optional): bars take their own space, the middle scrolls — no padding guessed for chrome */
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

  /* horizontal rail: the next item peeks at the edge; trailing room survives overflow */
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
/* /OD-LAYOUT-PRIMITIVES v1 */


    :root {
      --phone-screen-width: 412px;
      --phone-screen-height: 915px;
      --phone-bezel: 10px;
      --phone-outer-radius: 46px;
      --phone-screen-radius: 38px;
      --phone-safe-top: 52px;
      --phone-safe-bottom: 28px;
      --phone-system-fg: #17181a;
      --phone-screen-bg: #f6f7f9;
      --phone-stage-bg: #e8eaee;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(circle at 50% 14%, rgba(255,255,255,.95), transparent 36%),
        var(--phone-stage-bg);
      color: #191a1d;
      font-family: Roboto, "Noto Sans", system-ui, sans-serif;
    }

    .phone-frame {
      position: relative;
      width: calc(var(--phone-screen-width) + var(--phone-bezel) * 2);
      height: calc(var(--phone-screen-height) + var(--phone-bezel) * 2);
      padding: var(--phone-bezel);
      border-radius: var(--phone-outer-radius);
      background:
        linear-gradient(145deg, rgba(255,255,255,.2), transparent 18%),
        linear-gradient(155deg, #414348 0%, #23252a 44%, #0c0d10 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.13),
        inset 0 0 0 2px rgba(0,0,0,.84),
        0 34px 72px -22px rgba(8,10,14,.56),
        0 11px 25px -10px rgba(8,10,14,.34);
      isolation: isolate;
    }

    .phone-frame::before,
    .phone-frame::after {
      content: "";
      position: absolute;
      z-index: -1;
      top: 92px;
      bottom: 92px;
      width: 2px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,.14) 18%, transparent 32%, transparent 72%, rgba(255,255,255,.07) 88%, transparent);
    }
    .phone-frame::before { left: 0; }
    .phone-frame::after { right: 0; }

    .hardware-button {
      position: absolute;
      right: -3px;
      width: 4px;
      border-radius: 3px;
      background: linear-gradient(90deg, #08090b, #2d3036 62%, #08090b);
      box-shadow: inset 0 1px rgba(255,255,255,.1);
    }
    .hardware-button.volume { top: 205px; height: 92px; }
    .hardware-button.power { top: 322px; height: 70px; background: linear-gradient(90deg, #08090b, #3c424c 62%, #08090b); }

    .phone-screen {
      position: relative;
      width: var(--phone-screen-width);
      height: var(--phone-screen-height);
      overflow: hidden;
      border-radius: var(--phone-screen-radius);
      background: var(--phone-screen-bg);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.05);
    }

    .phone-content {
      position: absolute;
      inset: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-top: var(--phone-safe-top);
      padding-bottom: var(--phone-safe-bottom);
      background: var(--phone-screen-bg);
    }
    .phone-content::-webkit-scrollbar { display: none; }

    .punch-hole {
      position: absolute;
      z-index: 20;
      top: 14px;
      left: 50%;
      width: 14px;
      height: 14px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle at 38% 35%, #283343 0 10%, #090b0f 30%, #000 72%);
      box-shadow: 0 0 0 1px rgba(255,255,255,.08), inset 0 0 3px #000;
      pointer-events: none;
    }

    .status-bar {
      position: absolute;
      z-index: 15;
      inset: 0 0 auto;
      height: var(--phone-safe-top);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 64px minmax(0, 1fr);
      align-items: start;
      padding: 14px 19px 0;
      color: var(--phone-system-fg);
      pointer-events: none;
    }
    .status-time {
      justify-self: start;
      display: flex;
      align-items: center;
      height: 16px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: .01em;
    }
    .status-cutout-zone { width: 64px; }
    .status-icons {
      justify-self: end;
      display: inline-flex;
      align-items: center;
      height: 16px;
      gap: 5px;
    }
    .status-icons svg { display: block; flex: none; fill: currentColor; }
    .status-icons .wifi { width: 15px; height: 12px; }
    .status-icons .cellular { width: 14px; height: 12px; }
    .status-icons .battery { width: 9px; height: 14px; }

    .gesture-indicator {
      position: absolute;
      z-index: 20;
      left: 50%;
      bottom: 8px;
      width: 108px;
      height: 4px;
      transform: translateX(-50%);
      border-radius: 99px;
      background: var(--phone-system-fg);
      opacity: .86;
      pointer-events: none;
    }

    /* Preview-only content. Replace it without inheriting the style. */
    .sample-app { min-height: 100%; padding: 18px 20px 34px; background: #f6f7f9; }
    .sample-app .eyebrow { margin: 0 0 6px; color: #686c74; font-size: 12px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; }
    .sample-app h1 { margin: 0; font-size: 30px; line-height: 1.12; letter-spacing: -.025em; }
    .sample-app p { margin: 10px 0 25px; color: #656972; line-height: 1.5; }
    .sample-card { padding: 18px; border: 1px solid #e0e3e8; border-radius: 17px; background: #fff; box-shadow: 0 7px 20px rgba(20,24,32,.055); }
    .sample-card + .sample-card { margin-top: 12px; }

    /* Presentation scaling: keep the whole handset visible on short viewports. */
    @media (max-height: 998px) { .phone-frame { zoom: 0.9; } }
    @media (max-height: 904px) { .phone-frame { zoom: 0.82; } }
    @media (max-height: 829px) { .phone-frame { zoom: 0.74; } }
    @media (max-height: 754px) { .phone-frame { zoom: 0.66; } }
    /* Narrow viewports: the handset chrome collapses and the screen fills the
       viewport, so the app behaves like a real phone page instead of
       scrolling sideways. */
    @media (max-width: 480px) {
      body { padding: 0; display: block; }
      .phone-frame { width: 100%; height: 100dvh; padding: 0; border-radius: 0; background: none; box-shadow: none; zoom: 1; }
      .phone-frame::before, .phone-frame::after, .hardware-button { display: none; }
      .phone-screen { width: 100%; height: 100%; border-radius: 0; }
    }

/* tab-scroll-gradient-v1 — reference-led main-screen chrome only */
:root {
  --chrome-gradient: linear-gradient(180deg,
    #0759B0 0px,
    #0B67C0 128px,
    #2479C9 208px,
    #81AEDC 312px,
    #DDE9F6 424px,
    var(--canvas) 560px);
  --tab-selected-wash: linear-gradient(135deg, #FFFFFF2E 0%, #FFFFFF1A 48%, #FFFFFF06 100%);
  --tab-hover-wash: linear-gradient(135deg, #FFFFFF20 0%, #FFFFFF0A 72%, #FFFFFF00 100%);
  --scroll-fade-top-max: 16;
  --scroll-fade-bottom-max: 48;
}
.phone-content:not(.secondary-surface) {
  background: var(--chrome-gradient);
}
.app-header:not(.secondary-header) {
  background: transparent;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  border: 0;
  box-shadow: none;
}
.app-tabs {
  border: 0;
  box-shadow: none;
  background: transparent;
  -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000000 12px, #000000 calc(100% - 12px), transparent 100%);
  mask-image: linear-gradient(90deg, transparent 0%, #000000 12px, #000000 calc(100% - 12px), transparent 100%);
}
.app-tab {
  position: relative;
  border: 0;
  background: transparent;
  box-shadow: none;
  color: #F3F8FF;
}
.app-tab[aria-selected=true] {
  border: 0;
  background: var(--tab-selected-wash);
  box-shadow: none;
  color: #FFFFFF;
  font-weight: 650;
}
.app-tab:focus-visible {
  outline: 2px solid #FFFFFF;
  outline-offset: -4px;
}
.phone-content:not(.secondary-surface) .view {
  --scroll-fade-top: 0px;
  --scroll-fade-bottom: 0px;
  scroll-padding-block: 32px 56px;
  -webkit-mask-image: linear-gradient(to bottom,
    transparent 0px,
    #000000 var(--scroll-fade-top),
    #000000 calc(100% - var(--scroll-fade-bottom)),
    transparent 100%);
  mask-image: linear-gradient(to bottom,
    transparent 0px,
    #000000 var(--scroll-fade-top),
    #000000 calc(100% - var(--scroll-fade-bottom)),
    transparent 100%);
  -webkit-mask-repeat: no-repeat;
  mask-repeat: no-repeat;
  -webkit-mask-size: 100% 100%;
  mask-size: 100% 100%;
}
.phone-content:not(.secondary-surface) .action-footer {
  background: transparent;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  border: 0;
  box-shadow: none;
}
@media (hover:hover) {
  .app-tab:hover:not(:disabled) {
    background-color: transparent !important;
    background-image: var(--tab-hover-wash);
  }
  .app-tab[aria-selected=true]:hover:not(:disabled) {
    background-color: transparent !important;
    background-image: var(--tab-selected-wash);
  }
}
@media (prefers-reduced-transparency:reduce) {
  .phone-content:not(.secondary-surface) .view,
  .app-tabs {
    -webkit-mask-image: none;
    mask-image: none;
  }
  .app-header:not(.secondary-header),
  .phone-content:not(.secondary-surface) .action-footer {
    background: transparent !important;
  }
  .app-tab[aria-selected=true] { background: #245F9F; }
}
@media (prefers-contrast:more) {
  .phone-content:not(.secondary-surface) .view,
  .app-tabs {
    -webkit-mask-image: none;
    mask-image: none;
  }
  .app-tab[aria-selected=true] { background: #164D88; font-weight: 750; }
}


/* tab-glass-refinement-v1 — preserve header blue; soften only the marked seam */
:root {
  --tab-visible-inset: 8px;
  --tab-visible-radius: 16px;
  --tab-glass-fill: linear-gradient(145deg, #FFFFFF20 0%, #D9F5FF12 56%, #FFFFFF08 100%);
  --tab-glass-edge: linear-gradient(145deg, #C8F4FF9C 0%, #B6EBFF50 35%, #D9F5FF24 66%, #A9E5FF68 100%);
  --tab-inactive-text: linear-gradient(180deg, #DCEAFF 0%, #B3CFF1 60%, #9EBFE8 100%);
}
.app-tab,
.app-tab[aria-selected=true] {
  min-height: 48px;
  background: transparent;
  border: 0;
  box-shadow: none;
  isolation: isolate;
}
.app-tab::before {
  content: "";
  position: absolute;
  top: var(--tab-visible-inset);
  left: 0;
  width: 100%;
  height: calc(100% - var(--tab-visible-inset) * 2);
  box-sizing: border-box;
  border-radius: var(--tab-visible-radius);
  pointer-events: none;
  opacity: 0;
  transition: opacity var(--motion) ease-out;
}
.app-tab[aria-selected=true]::before {
  opacity: 1;
  border: 1px solid transparent;
  background: var(--tab-glass-fill) padding-box, var(--tab-glass-edge) border-box;
  box-shadow: inset 0 1px 0 #FFFFFF20, inset 0 -1px 0 #B2E8FF12;
  backdrop-filter: blur(12px) saturate(120%);
  -webkit-backdrop-filter: blur(12px) saturate(120%);
}
.app-tab .tab-label {
  display: block;
  position: relative;
  z-index: 1;
  color: #C6DDF8;
  font-weight: 500;
}
.app-tab:not([aria-selected=true]) .tab-label {
  background-image: var(--tab-inactive-text);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
}
.app-tab[aria-selected=true] .tab-label {
  background: none;
  color: #FFFFFF;
  -webkit-text-fill-color: #FFFFFF;
  font-weight: 650;
}
.phone-content:not(.secondary-surface) .view {
  -webkit-mask-image: linear-gradient(to bottom,
    transparent 0px,
    #00000066 calc(var(--scroll-fade-top) * .25),
    #000000C2 calc(var(--scroll-fade-top) * .5),
    #000000EF calc(var(--scroll-fade-top) * .75),
    #000000 var(--scroll-fade-top),
    #000000 calc(100% - var(--scroll-fade-bottom)),
    transparent 100%);

/* Budget: shared category colors, readable amounts, and in-flow expansion. */
:root{--budget-ring-size:96px;--budget-row-gap:12px;--budget-soft:#F0F5FC;--budget-indent:16px;--budget-enter:180ms}

.budget-heading h2{margin:0;font-size:var(--text-lg);font-weight:650}

.budget-overview{display:flex;flex-direction:column;gap:var(--space-2);min-width:0;padding:var(--space-4);background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow)}

.budget-stat>span{font-size:var(--text-base);line-height:1.5;color:var(--muted)}
.budget-stat-total{text-align:right}
.budget-ring{display:block;flex:none;width:var(--budget-ring-size);height:auto;aspect-ratio:1}
.budget-ring-text{font-family:var(--font);font-size:28px;font-weight:650;fill:var(--ink)}
.budget-status{margin:0;color:var(--muted);font-size:var(--text-base);line-height:1.5;overflow-wrap:anywhere}
.budget-overview-bottom{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center;justify-content:space-between;min-width:0}
.budget-date{display:block;white-space:nowrap;font-size:var(--text-base);font-variant-numeric:tabular-nums;color:var(--muted)}
.budget-period{margin-left:auto;background:transparent;border:0;padding:0;gap:var(--space-1);box-shadow:none}
.budget-period button{position:relative;isolation:isolate;min-width:44px;min-height:44px;padding:0;color:var(--muted);background:transparent;font-size:var(--text-base)}

.budget-period button[aria-pressed=true]::before{content:"";position:absolute;top:8px;bottom:8px;left:4px;right:4px;border-radius:8px;background:var(--blue-tint);z-index:-1}
.budget-period button[aria-pressed=false]{background:transparent}
.budget-list{display:flex;flex-direction:column;gap:var(--space-3);min-width:0}
.budget-columns,.budget-category-toggle,.budget-child-choice{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--space-2);min-width:0;width:100%;color:var(--ink)}
.budget-columns{padding:0 var(--space-2);font-size:var(--text-base);color:var(--muted)}
.budget-group{min-width:0;padding:var(--space-2);border-radius:var(--control-radius)}
.budget-category-toggle,.budget-child-choice{min-height:48px;padding:var(--space-2) 0;background:transparent;border:0;text-align:left;cursor:pointer;font-size:var(--text-base);border-radius:var(--space-2)}

.budget-row-name .asset-icon{flex:none;width:20px;height:20px}
.budget-row-name .small-icon{width:16px;height:16px}

.budget-migration .secondary{width:100%}
.budget-form .sub-service-rail{--od-rail-pad:0}
.budget-form-icon{display:flex;align-items:center;justify-content:center;flex:none;width:24px;height:24px}
.budget-form .sub-service-choice>.asset-icon{flex:none;width:20px;height:20px}
.budget-form-help p{margin:0;font-size:var(--text-base);line-height:1.5;color:var(--muted)}

.budget-allocation-row{--od-gap:var(--space-3);flex-wrap:wrap}

.budget-allocation-total{margin:0;color:var(--blue);font-size:var(--text-base);line-height:1.5}
.manual-entry .entry-secondary{display:flex;flex-direction:column;gap:var(--space-2);min-width:0}
.entry-secondary-heading{display:flex;justify-content:center;gap:var(--space-2);color:var(--muted);font-size:var(--text-base)}
.manual-entry .expense-secondary-rail{--od-rail-pad:0;--od-gap:var(--space-2);padding-block:var(--space-1);mask-image:none;-webkit-mask-image:none}
.manual-entry .expense-secondary-choice{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:var(--space-2);flex:none;width:auto;min-height:44px;padding:var(--space-2) var(--space-3);border:1px solid transparent;border-radius:var(--control-radius);background:var(--entry-bg);color:var(--muted);font-size:var(--text-base);white-space:nowrap}

.budget-input-fields .form-field>label{position:absolute;display:block;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media(hover:hover){.budget-category-toggle:hover,.budget-child-choice:hover{color:var(--blue)}.budget-period button[aria-pressed=false]:hover{background:transparent;color:var(--blue)}.budget-add:hover{background:var(--blue-tint)}}
@media(prefers-reduced-motion:no-preference){.budget-children:not([hidden]){animation:budget-reveal var(--budget-enter) ease-out}}
@keyframes budget-reveal{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:375px){.budget-module{--budget-ring-size:88px}.budget-overview{padding:var(--space-3)}.budget-children{--budget-indent:8px}.budget-row-amounts>span{min-width:64px}}


/* Overdue expense review: daily card pack, never part of accounting until confirmed. */
:root{--review-radius:24px;--review-stack-inset:8px;--review-stack-step:12px;--review-stack-middle:#EDF3FA;--review-stack-back:#DCE8F6;--review-stack-shadow:0 4px 12px #1928500A;--review-row-gap:8px;--review-row-min:48px;--review-list-gap:8px;--review-category-column:4rem;--review-amount-column:6rem;--review-list-size:calc(var(--review-row-min) * 3 + var(--review-list-gap) * 2);--review-action-fill:#EAF3FD;--review-edit-width:224px}
.overdue-review{--od-gap:var(--space-1);min-width:0}
.review-heading{min-width:0;gap:var(--space-2)}
.review-heading h2{margin:0;padding-inline:var(--space-1);font-size:var(--text-base);line-height:1.5;font-weight:650}
.review-heading .text-button{min-height:44px;flex:none;white-space:nowrap;padding:var(--space-1) var(--space-2)}
/* Empty pseudo-elements are decorative back cards, not additional review dates. */
.review-deck{position:relative;isolation:isolate;min-width:0;padding-top:calc(var(--review-stack-step) * 2)}
.review-deck::before,.review-deck::after{content:"";position:absolute;left:var(--review-stack-inset);right:var(--review-stack-inset);height:calc(var(--review-radius) * 3);border-radius:var(--review-radius);border:1px solid var(--line);box-shadow:var(--review-stack-shadow);pointer-events:none}
.review-deck::before{z-index:0;left:calc(var(--review-stack-inset) * 2);right:calc(var(--review-stack-inset) * 2);top:0;background:var(--review-stack-back)}
.review-deck::after{z-index:1;top:var(--review-stack-step);background:var(--review-stack-middle)}
.review-front{position:relative;z-index:2;display:flex;flex-direction:column;gap:var(--space-3);min-width:0;padding:var(--space-4);border:1px solid var(--line);border-radius:var(--review-radius);background:var(--surface);color:var(--ink);box-shadow:0 4px 16px #19285006}
.review-card-heading{--od-gap:var(--space-1);text-align:center;padding-top:var(--space-1)}
.review-card-heading h3{margin:0;font-size:var(--text-base);line-height:1.5;font-weight:600;color:var(--muted)}
.review-items{--od-gap:var(--review-list-gap);min-width:0;min-height:0;max-height:var(--review-list-size);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-gutter:stable}
.review-items>*{flex-shrink:0}
.review-item{display:grid;grid-template-columns:minmax(0,1fr) var(--review-category-column) var(--review-amount-column);align-items:center;gap:var(--review-row-gap);width:100%;min-width:0;min-height:var(--review-row-min);padding:var(--space-2) 0;margin:0;border:0;border-radius:var(--space-2);background:transparent;color:var(--ink);text-align:left;cursor:pointer}
.review-item-name{font-size:var(--text-base);line-height:1.5;font-weight:500}
.review-item-amount{display:block;width:max-content;justify-self:end;font-size:var(--text-base);line-height:1.5;font-weight:650;text-align:right;font-variant-numeric:tabular-nums}
.review-category{display:flex;width:max-content;justify-self:center;align-items:center;justify-content:center;gap:var(--space-1);padding:var(--space-1) var(--space-2);border-radius:999px;font-size:var(--text-sm);line-height:1.5;white-space:nowrap}
.review-category>span{display:block}
.review-category .small-icon{flex:none;width:16px;height:16px}
.review-tone-blue{background:#EAF3FD;color:#1B5799}
.review-tone-teal{background:#E7F3F0;color:#12564F}
.review-tone-rose{background:#FAECF1;color:#8C3151}
.review-tone-amber{background:#FFF4DF;color:#865600}
.review-tone-slate{background:#EDF1F6;color:#45566C}
.review-row-issue{display:block;grid-column:1/-1;font-size:var(--text-sm);line-height:1.5;color:var(--red);overflow-wrap:anywhere}
.review-items[data-review-layout="compact"] .review-item{grid-template-columns:minmax(0,1fr) var(--review-amount-column)}
.review-items[data-review-layout="compact"] .review-item-name{grid-column:1/-1;grid-row:1}
.review-items[data-review-layout="compact"] .review-category{grid-column:1;grid-row:2;justify-self:start}

.review-items[data-review-layout="stacked"] .review-item{grid-template-columns:minmax(0,1fr)}

.review-items[data-review-layout="stacked"] .review-item-amount{grid-column:1;grid-row:3}
.review-card-footer{display:flex;flex-direction:column;gap:var(--space-2)}
.review-confirm{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;padding:var(--space-3) var(--space-4);border:0;border-radius:999px;color:var(--blue);background:var(--review-action-fill);font-size:var(--text-base);line-height:1.5;font-weight:650;white-space:nowrap;cursor:pointer}
.review-readonly{display:block;color:var(--muted);font-size:var(--text-sm);line-height:1.5;text-align:center}
.review-confirm:active{transform:scale(.98)}
.review-items:focus-visible,.review-item:focus-visible,.review-confirm:focus-visible,.review-date-row:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.review-empty{padding:var(--space-3) var(--space-4);border-radius:var(--radius);background:var(--surface);--od-gap:var(--space-1)}
.review-empty strong{font-size:var(--text-base);font-weight:600}
.review-empty>span{font-size:var(--text-sm);line-height:1.5;color:var(--muted)}
.review-error{margin:0;padding:var(--space-2);border-radius:var(--space-2);font-size:var(--text-base);line-height:1.5;color:var(--red);background:var(--red-tint);overflow-wrap:anywhere}
.review-error:empty,.review-error[hidden]{display:none}
.review-date-list{--od-gap:var(--space-2)}
.review-date-row{width:100%;min-height:64px;padding:var(--space-3);border-radius:var(--space-3);background:var(--canvas);color:var(--ink);text-align:left}
.review-date-row .od-field>span{font-size:var(--text-sm);color:var(--muted)}
.review-edit-date,.review-edit-note{margin:0;color:var(--muted);font-size:var(--text-base);line-height:1.5}

function ensureEntryCatalog(data){

 for(const preset of cats){const old=data.categories.find(c=>c.id===preset.id);if(!old)data.categories.push(clone(preset));else{old.entryType=preset.entryType;if(preset.id==='travel'&&old.name==='出行')old.name='交通'}}

function entryCategories(type,retained=''){

function dateObj(s){return new Date(s+'T12:00:00Z')}
function dateStr(d){return d.toISOString().slice(0,10)}
function addDays(s,n){const d=dateObj(s);d.setUTCDate(d.getUTCDate()+n);return dateStr(d)}
function daysBetween(a,b){return Math.max(0,Math.round((dateObj(b)-dateObj(a))/86400000)+1)}
function validDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(s)&&!Number.isNaN(+dateObj(s))&&dateStr(dateObj(s))===s}
function monthEnd(m){const [y,n]=m.split('-').map(Number);return dateStr(new Date(Date.UTC(y,n,0,12)))}
function shiftMonth(m,n){const [y,mo]=m.split('-').map(Number);return dateStr(new Date(Date.UTC(y,mo-1+n,1,12))).slice(0,7)}
function amountCents(v){const s=String(v??'').trim().replace(/,/g,'');if(!/^\d+(\.\d{1,2})?$/.test(s))return null;const [a,b='']=s.split('.');const n=Number(a)*100+Number(b.padEnd(2,'0'));return Number.isSafeInteger(n)&&n<=99999999999?n:null}
function valueYuan(c){return c==null?'':(c/100).toFixed(2)}
function rawMoney(c,dec=2){return (Number(c||0)/100).toLocaleString('zh-CN',{minimumFractionDigits:dec,maximumFractionDigits:dec})}
function money(c,dec=2){return S.settings.hidden?'••••':'¥'+rawMoney(c,dec)}
function signed(t){const plus=['income','refund','recovery'].includes(t.type);return (t.type==='transfer'?'':plus?'+':'−')+money(t.amount)}
function friendlyDate(d){if(d===TODAY)return '今天';if(d===addDays(TODAY,-1))return '昨天';return d.slice(5).replace('-','月')+'日'}
function displayDate(d){return d?d.replace(/-/g,'.'):'未填写'}
function sum(a,fn=x=>x.amount){return a.reduce((n,x)=>n+fn(x),0)}
function effect(t,account){if(t.void)return 0;if(t.type==='transfer')return (t.toAccount===account?t.amount:0)-(t.account===account?t.amount:0);if(t.account!==account)return 0;return ['income','refund','recovery'].includes(t.type)?t.amount:-t.amount}

   if(legacy==null){const m=data.budgetConfig.periods.month.limits;m.food.children={'food-breakfast':30000,'food-lunch':70000,'food-dinner':70000,'food-snacks':10000,'food-drinks':20000};m.housing.children={'housing-rent':300000,'housing-property':20000,'housing-utilities':20000};m.travel.children={'travel-transit':20000,'travel-taxi':30000};m.shopping.children={'shopping-clothes':50000,'shopping-daily':30000};}
  }
 }
 if(data.sample&&!data.budgetDemoVersion){
  const examples={'tx-1':['十月房租','housing','housing-rent'],'tx-3':['公交充值','travel','travel-transit'],'tx-7':['日用品','shopping','shopping-daily'],'tx-11':['晚餐','food','food-dinner'],'tx-13':['午餐','food','food-lunch'],'tx-15':['午餐','food','food-lunch'],'tx-18':['晚餐','food','food-dinner'],'tx-19':['秋季外套','shopping','shopping-clothes'],'tx-22':['晚餐','food','food-dinner'],'tx-24':['午餐','food','food-lunch'],'tx-25':['打车','travel','travel-taxi']};
  data.transactions.forEach(t=>{const e=examples[t.id];if(e&&t.source==='示例账本'&&t.name===e[0]&&t.category===e[1]&&!Object.prototype.hasOwnProperty.call(t,'subcategoryId'))t.subcategoryId=e[2]});data.budgetDemoVersion=1;
 }
 if(data.budgetConfig.legacyMonthly==null){const limits=data.budgetConfig.periods.month.limits;data.settings.budget=Object.keys(limits).length?Object.values(limits).reduce((n,v)=>n+v.amount,0):null}

function validateBudgetExtension(data){
 const safe=n=>Number.isSafeInteger(n)&&n>=0&&n<=BUDGET_MAX,obj=v=>v&&typeof v==='object'&&!Array.isArray(v);
 for(const t of data.transactions){if(t.subcategoryId!=null&&typeof t.subcategoryId!=='string')return '二级分类格式不正确';if(t.subcategoryId&&(!['expense','refund'].includes(t.type)||!expenseChild(budgetClassification(t,data.transactions).category,t.subcategoryId)))return '二级分类不属于账单的一级分类'}
 const b=data.budgetConfig;if(b==null)return '';if(!obj(b)||b.version!==1||!obj(b.periods))return '预算配置格式不正确';
 if(b.legacyMonthly!=null&&!safe(b.legacyMonthly)||b.legacyMonthlyOriginal!=null&&!safe(b.legacyMonthlyOriginal))return '原月度预算格式不正确';
 for(const [period]of BUDGET_PERIODS){const p=b.periods[period];if(!obj(p)||!obj(p.limits))return '缺少有效周期预算';let total=0;
  for(const [cat,limit]of Object.entries(p.limits)){if(!Object.prototype.hasOwnProperty.call(EXPENSE_SUBCATEGORIES,cat)||!obj(limit)||!safe(limit.amount)||!obj(limit.children))return '分类预算格式不正确';let childTotal=0;
   for(const [id,amount]of Object.entries(limit.children)){if(!expenseChild(cat,id)||!safe(amount))return '二级预算格式不正确';childTotal+=amount}
   if(childTotal>limit.amount)return '二级预算合计超过一级预算';total+=limit.amount;
  }if(!safe(total))return '预算总额超出范围';
 }if(b.legacyMonthly!=null&&Object.keys(b.periods.month.limits).length)return '待分配月度预算不能与分类额度同时存在';return '';
}
function budgetPeriod(mode=U.budgetPeriod||'month'){
 if(!BUDGET_PERIODS.some(p=>p[0]===mode))mode='month';const today=currentLocalStamp().date,year=today.slice(0,4),month=today.slice(0,7);let from,to,label;
 if(mode==='year'){from=year+'-01-01';to=year+'-12-31';label=year.slice(2)+'年'}else if(mode==='week'){from=addDays(today,-((dateObj(today).getUTCDay()+6)%7));to=addDays(from,6);label=from.slice(5).replace('-','.')+'–'+to.slice(5).replace('-','.')}else{from=month+'-01';to=monthEnd(month);label=month.slice(2).replace('-','.')}
 return {mode,today,from,to,label,name:{year:'年度',month:'月度',week:'周度'}[mode]};
}
function budgetModel(mode){

 const groups=expensePrimary().map(c=>({...c,spent:0,children:expenseChildren(c.id).map(s=>({...s,spent:0})),unclassified:0,limit:limits[c.id]||null})),historical=[];
 for(const t of rows){const p=budgetClassification(t),amount=t.type==='expense'?t.amount:-t.amount;let group=groups.find(g=>g.id===p.category)||historical.find(g=>g.id===p.category);if(!group){group={...category(p.category),spent:0,children:[],unclassified:0,limit:null,historical:true};historical.push(group)}group.spent+=amount;const child=group.children.find(s=>s.id===p.subcategoryId);if(child)child.spent+=amount;else group.unclassified+=amount}
 const all=[...groups,...historical],spent=all.reduce((n,g)=>n+g.spent,0),total=Object.values(limits).reduce((n,v)=>n+v.amount,0);
 return {period,limits,groups,historical,all,spent,total,hasBudget:Object.keys(limits).length>0,legacy:period.mode==='month'?config?.legacyMonthly:null,negative:all.some(g=>g.spent<0)};
}

 if(typeof reviews!=='object'||Array.isArray(reviews)||Object.keys(reviews).length>10000)return '待确认草稿格式不正确';
 const recIds=new Set(data.recurring.map(r=>r.id)),catIds=new Set(data.categories.map(c=>c.id)),accountIds=new Set(data.accounts.map(a=>a.id));
 for(const [key,v]of Object.entries(reviews)){
  const match=/^([a-zA-Z0-9_-]{1,120})@(\d{4}-\d{2}-\d{2})$/.exec(key);
  if(!match||!recIds.has(match[1])||!validDate(match[2])||!v||typeof v!=='object'||Array.isArray(v))return '待确认草稿关联不正确';
  if(typeof v.name!=='string'||!v.name.trim()||v.name.length>80||!Number.isSafeInteger(v.amount)||v.amount<=0||v.amount>99999999999)return '待确认草稿名称或金额不正确';

function overdueReviewModel(){
 const today=currentLocalStamp().date;if(overdueModelCache?.store===S&&overdueModelCache.today===today)return overdueModelCache;
 const until=addDays(today,-1),items=new Map(),txs=activeTx(),activeIds=new Set(txs.map(t=>t.id)),linkedKeys=new Set(txs.map(t=>t.recurringKey).filter(Boolean));
 const handled=key=>{const inst=S.instances[key];return linkedKeys.has(key)||inst?.status==='skipped'||inst?.status==='recorded'&&activeIds.has(inst.txId)};
 const add=(r,date)=>{
  const key=r.id+'@'+date;if(date>=today||handled(key))return;
  const draft=S.occurrenceReviews?.[key];
  items.set(key,{...r,...draft,id:r.id,type:'expense',key,date,scheduledDate:date,edited:!!draft,subcategoryId:draft?.subcategoryId||r.subcategoryId||'',account:draft?draft.account||'':r.account||'',note:draft?draft.note||'':r.note||''});
 };
 for(const r of S.recurring){
  if(r.type!=='expense'||r.paused||!validDate(r.date)||r.date>until)continue;
  const end=r.endDate&&r.endDate<until?r.endDate:until;if(!validDate(end)||end<r.date)continue;
  const a=dateObj(r.date),b=dateObj(end),months=(b.getUTCFullYear()-a.getUTCFullYear())*12+b.getUTCMonth()-a.getUTCMonth();
  const step={monthly:1,quarterly:3,yearly:12}[r.frequency]||1;
  const count=r.frequency==='weekly'?Math.floor((b-a)/604800000):Math.floor(months/step);
  for(let n=0;n<=count;n++){const date=occurrenceDate(r,n);if(date>end)break;add(r,date)}
 }
 // Saved one-occurrence edits remain reviewable if their template is paused later.
 for(const key of Object.keys(S.occurrenceReviews||{})){
  const at=key.lastIndexOf('@'),r=S.recurring.find(r=>r.id===key.slice(0,at)),date=key.slice(at+1);
  if(r?.type==='expense'&&validDate(date)&&date<today)add(r,date);
 }

}

 if(recurringHistoryCache?.store===S&&recurringHistoryCache.today===today)return recurringHistoryCache;
 const templates=new Map(S.recurring.map(r=>[r.id,r]));
 const expenses=activeTx().filter(t=>t.type==='expense'),byId=new Map(expenses.map(t=>[t.id,t])),links=new Map();
 // A live linked expense is the authority, including links made before instance tracking.
 for(const t of expenses){

  if(parsed&&parsed.date<=today&&!links.has(t.recurringKey))links.set(t.recurringKey,t);
 }

  const parsed=recurringHistoryKey(key),t=instance?.status==='recorded'?byId.get(instance.txId):null;
  if(parsed&&parsed.date<=today&&t&&(!t.recurringKey||t.recurringKey===key)&&!links.has(key))links.set(key,t);

 const context={store:S,today,templates,links,saved:new Map(),savedRows:[],series:[]};
 const keys=new Set([...Object.keys(S.instances||{}),...Object.keys(S.occurrenceReviews||{}),...links.keys()]);
 for(const key of keys){const row=resolveRecurringHistoryRow(key,context);if(row)context.saved.set(key,row)}
 context.savedRows=[...context.saved.values()].sort(compareRecurringHistory);
 for(const r of S.recurring){
  if(r.type!=='expense'||r.paused||!validDate(r.date)||r.date>today)continue;

  if(!validDate(end)||end<r.date)continue;
  const start=dateObj(r.date),last=dateObj(end),step={monthly:1,quarterly:3,yearly:12}[r.frequency]||1;

function dashboardAnchor(){
 const today=currentLocalStamp().date,candidate=U.dashboardDate;
 return validDate(candidate)&&candidate<=today?candidate:today;
}
function dashboardMode(){return ['year','month','day'].includes(U.dashboardPeriod)?U.dashboardPeriod:'day'}
function dashboardRange(){
 const anchor=dashboardAnchor(),today=currentLocalStamp().date,kind=dashboardMode(),year=anchor.slice(0,4),month=anchor.slice(0,7);
 const start=kind==='year'?year+'-01-01':kind==='month'?month+'-01':anchor;
 const nominalEnd=kind==='year'?year+'-12-31':kind==='month'?monthEnd(month):anchor;
 const end=nominalEnd>today?today:nominalEnd,current=today>=start&&today<=nominalEnd;
 const label=kind==='year'?Number(year)+'年':kind==='month'?Number(year)+'年'+Number(anchor.slice(5,7))+'月':Number(year)+'年'+Number(anchor.slice(5,7))+'月'+Number(anchor.slice(-2))+'日';
 return {kind,anchor,start,end,nominalEnd,label,shortLabel:label,unit:{year:'年',month:'月',day:'日'}[kind],current,seriesLabel:{year:'年度',month:'月度',day:'当日'}[kind]};
}
function periodTransactions(start,end){return activeTx().filter(t=>t.date>=start&&t.date<=end&&t.date<=currentLocalStamp().date)}
function homeBucketDate(model,index){
 if(model.step==='year')return String(Number(model.first.slice(0,4))+index).padStart(4,'0')+'-01-01';
 return model.step==='month'?shiftMonth(model.first.slice(0,7),index)+'-01':addDays(model.first,index);
}
function homeBucketIndex(model,date){
 const years=Number(date.slice(0,4))-Number(model.first.slice(0,4));
 if(model.step==='year')return years;
 return model.step==='month'?years*12+Number(date.slice(5,7))-Number(model.first.slice(5,7)):Math.round((dateObj(date)-dateObj(model.first))/86400000);
}
function dashboardChartModel(){
 const today=currentLocalStamp().date,period=dashboardRange(),step=period.kind;
 const bucketKey=date=>step==='year'?date.slice(0,4)+'-01-01':step==='month'?date.slice(0,7)+'-01':date;
 const rows=activeTx().filter(t=>['expense','refund'].includes(t.type)&&t.date<=today),buckets=new Map();
 const selected=bucketKey(period.anchor),last=bucketKey(today);
 let first=step==='day'?addDays(today,-13):today.slice(0,4)+'-01-01',max=100;
 if(selected<first)first=selected;
 for(const t of rows){const key=bucketKey(t.date);if(key<first)first=key;const bucket=buckets.get(key)||{expense:0,refund:0};bucket[t.type]+=t.amount;buckets.set(key,bucket)}
 for(const bucket of buckets.values())max=Math.max(max,bucket.expense);
 const model={today,first,last,step,buckets,max,selected,hasData:rows.length>0};
 model.count=homeBucketIndex(model,last)+1;return model;
}

  const spoken=model.step==='year'?Number(date.slice(0,4))+'年':model.step==='month'?Number(date.slice(0,4))+'年'+Number(date.slice(5,7))+'月':date;

function cbMode(){return BUDGET_PERIODS.some(([id])=>id===U.budgetPeriod)?U.budgetPeriod:'month'}
function cbPeriodAt(mode,date=currentLocalStamp().date){
 const today=currentLocalStamp().date,d=validDate(date)?date:today;let from,to,label,short,sub;
 if(mode==='year'){from=d.slice(0,4)+'-01-01';to=d.slice(0,4)+'-12-31';label=d.slice(0,4)+'年';short=label;sub='全年'}
 else if(mode==='week'){from=addDays(d,-((dateObj(d).getUTCDay()+6)%7));to=addDays(from,6);label=displayDate(from)+' — '+displayDate(to);short=from.slice(5).replace('-','/');sub='至 '+to.slice(5).replace('-','/')}
 else{mode='month';from=d.slice(0,7)+'-01';to=monthEnd(d.slice(0,7));label=Number(d.slice(0,4))+'年'+Number(d.slice(5,7))+'月';short=Number(d.slice(5,7))+'月';sub=d.slice(0,4)+'年'}
 return {mode,from,to,label,short,sub,today,current:from<=today&&to>=today,name:{year:'年度',month:'月度',week:'周度'}[mode]};
}
function cbShiftPeriod(from,mode,delta){const d=dateObj(from);if(mode==='year')d.setUTCFullYear(d.getUTCFullYear()+delta);else if(mode==='week')d.setUTCDate(d.getUTCDate()+delta*7);else d.setUTCMonth(d.getUTCMonth()+delta);return dateStr(d)}
function cbPeriodDistance(from,to,mode){if(mode==='year')return Number(to.slice(0,4))-Number(from.slice(0,4));if(mode==='week')return Math.round((dateObj(to)-dateObj(from))/604800000);return (Number(to.slice(0,4))-Number(from.slice(0,4)))*12+Number(to.slice(5,7))-Number(from.slice(5,7))}
function cbRows(){
 const today=currentLocalStamp().date,originals=new Map(S.transactions.map(t=>[t.id,t]));
 return activeTx().filter(t=>{
  if(!['expense','refund'].includes(t.type)||!validDate(t.date)||t.date>today||t.pending===true||t.confirmed===false||['pending','draft'].includes(t.status))return false;
  if(t.type==='refund'){const original=originals.get(t.refundOf);return !!original&&!original.void&&original.type==='expense'&&validDate(original.date)&&original.date<=today}
  return true;
 });
}
function cbCategories(rows=cbRows()){
 const base=expensePrimary().map(c=>({...c,...(S.categories.find(x=>x.id===c.id)||{}),historical:false})),known=new Set(base.map(c=>c.id));
 const ids=new Set(rows.map(t=>budgetClassification(t).category));
 for(const [mode]of BUDGET_PERIODS)Object.keys(S.budgetConfig?.periods[mode]?.limits||{}).forEach(id=>ids.add(id));
 for(const id of ids)if(id&&!known.has(id)){const c=S.categories.find(x=>x.id===id);base.push({id,name:c?.name||'历史分类',icon:c?.icon||'other',color:c?.color||'#657692',historical:true});known.add(id)}

function cbCompact(c){if(S.settings.hidden)return '••••';const n=Math.abs(c),sign=c<0?'−':'';if(n>=10000000000)return sign+'¥'+(n/10000000000).toLocaleString('zh-CN',{maximumFractionDigits:1})+'亿';if(n>=1000000)return sign+'¥'+(n/1000000).toLocaleString('zh-CN',{maximumFractionDigits:1})+'万';return sign+'¥'+rawMoney(n,n%100?2:0)}
function cbStatus(spent,amount){
 if(spent<0)return {key:'refund',label:'净退款',tone:'var(--green)',value:-spent};
 if(amount==null)return {key:'unset',label:'未设置',tone:'var(--muted)',value:null};
 if(spent>amount)return {key:'over',label:'超出预算',tone:'var(--red)',value:spent-amount};
 if(spent===amount)return {key:'equal',label:'等于预算',tone:'var(--blue)',value:0};
 return {key:'under',label:'预算内',tone:'var(--green)',value:amount-spent};
}

// Statistics demonstrations are kept outside S and never committed to the ledger.
const HS_START='2025-01-01',HS_END='2026-10-27',HS_TIME='20:30';

function hsCreateTransactions(){
 const rows=[];
 const add=(date,time,name,amount,category,type='expense',account='wechat')=>{
  if(date===HS_END&&time>HS_TIME)return;
  rows.push(Object.freeze({id:'stat-demo-'+date+'-'+rows.length,date,time,name,amount,category,type,account,source:'统计示例',note:''}));
 };
 for(let date=HS_START,index=0;date<=HS_END;date=addDays(date,1),index++){
  const day=Number(date.slice(8)),month=Number(date.slice(5,7)),year=Number(date.slice(0,4)),weekday=dateObj(date).getUTCDay();
  const variation=(index*37+month*19)%71,season=(year-2025)*150;
  add(date,'12:15','午餐',2200+variation*17,'food');
  add(date,'19:10',weekday===0?'周末晚餐':'晚餐',3100+((index*23)%63)*25,'food','expense','alipay');
  if(weekday>0&&weekday<6)add(date,'08:10','通勤交通',600+(index%4)*200,'travel','expense','alipay');
  if(index%3===0)add(date,'08:35','咖啡',1800+(index%5)*200,'food');
  if(day===1)add(date,'09:00','房租',330000+season*100,'housing','expense','bank');
  if(day===2)add(date,'10:20','手机话费',5900,'communication','expense','alipay');
  if(day===15)add(date,'18:20','水电费用',16800+month*370,'housing','expense','alipay');
  if([6,17,25].includes(day))add(date,'17:40','日用品采购',8600+(index%17)*930,'shopping');
  if(day===12||day===24)add(date,'20:10',day===12?'衣物购置':'生活用品',15900+(index%11)*2300,'shopping','expense','alipay');
  if(day===9&&month%3===0)add(date,'11:20','门诊与药品',18500+(month%4)*2700,'medical','expense','bank');
  if(day===14)add(date,'21:00','会员订阅',2500+(month%3)*1000,'other','expense','alipay');
  if(day===10)add(date,'09:05','工资收入',1680000+season*100+(month%4)*30000,'salary','income','bank');
  if([8,16,27].includes(day))add(date,'13:40','项目收入',86000+(month%5)*17000+(day%4)*13000,'income-other','income','bank');
  if(day===23)add(date,'15:00','理财收益',12300+(index%9)*2400,'investment','income','bank');
  if(day===3&&month%2===1)add(date,'10:00','生活补贴',60000,'allowance','income','bank');
  if(day===6&&month%3===1)add(date,'18:30','节日红包',20000+(month%3)*10000,'redpacket','income','wechat');
 }
 return rows;
}

function hsDateAt(month,day){return month+'-'+String(Math.min(day,Number(monthEnd(month).slice(8)))).padStart(2,'0')}
function hsBounds(mode,date){
 const start=mode==='year'?date.slice(0,4)+'-01-01':mode==='month'?date.slice(0,7)+'-01':date;

  if(mode==='year')previous.cutDate=hsDateAt(previous.start.slice(0,4)+HS_END.slice(4,7),Number(HS_END.slice(8)));
  else if(mode==='month')previous.cutDate=hsDateAt(previous.start.slice(0,7),Number(HS_END.slice(8)));

function hsPercentParts(rows,type){

 if(total){let assigned=0;parts.forEach(p=>{const exact=p.value/total*1000;p.units=Math.floor(exact);p.remainder=exact-p.units;assigned+=p.units});const order=parts.slice().sort((a,b)=>b.remainder-a.remainder);for(let i=0;i<1000-assigned;i++)order[i%order.length].units++;}

function hsSeries(rows,range,mode,count){

  let date,time='00:00';
  if(mode==='year')date=range.start.slice(0,4)+'-'+String(i+1).padStart(2,'0')+'-01';
  else if(mode==='month'){if(i>=Number(range.end.slice(8)))return null;date=range.start.slice(0,7)+'-'+String(i+1).padStart(2,'0')}
  else{date=range.start;time=String(i).padStart(2,'0')+':00'}
  const stamp=date+' '+time;
  return stamp<first||stamp>last||stamp>cutoff?null:0;
 });
 rows.forEach(t=>{const i=mode==='year'?Number(t.date.slice(5,7))-1:mode==='month'?Number(t.date.slice(8))-1:Number(t.time.slice(0,2));if(values[i]!=null)values[i]+=t.amount});
 return values;
}
function hsModel(){
 const range=hsRange(),type=hsType(),all=hsRows(range.current),rows=all.filter(t=>t.type===type),prior=hsRows(range.previous,type);
 const count=range.mode==='year'?12:range.mode==='day'?24:Number(range.current.end.slice(8));

 const growthValues=currentValues.map((v,i)=>v==null||previousValues[i]==null||previousValues[i]<=0?null:(v-previousValues[i])/previousValues[i]*100);
 const extent=Math.max(100,...growthValues.filter(v=>v!=null).map(Math.abs));
 const ratePower=10**Math.floor(Math.log10(extent)),rateUnit=[1,2,5,10].find(n=>n*ratePower>=extent)||10,rateLimit=rateUnit*ratePower;

function hsNeighbor(delta){

 else date=addDays(anchor,delta);
 const bounds=hsBounds(mode,date);if(bounds.end<HS_START||bounds.start>HS_END)return '';

}
function hsSegment(mode){return '<div class="hs-segment" role="group" aria-label="统计周期">'+[['year','年'],['month','月'],['day','日']].map(([id,label])=>button(label,'hs-period',id,'','aria-pressed="'+(mode===id)+'"')).join('')+'</div>'}

function hsAxis(value){if(S.settings.hidden)return '••';const yuan=value/100;return yuan>=10000?(Math.round(yuan/1000)/10)+'万':yuan>=1000?(Math.round(yuan/100)/10)+'千':String(Math.round(yuan))}
function hsPointLabel(m,range,i){
 if(m.mode==='year')return Number(range.start.slice(0,4))+'年'+(i+1)+'月';

 const magnitude=Math.abs(value),digits=magnitude<.1?2:1;

function hsRateAxis(value){

const HS_PLOT=Object.freeze({viewWidth:360,left:44,right:300,top:16,bottom:160});
function hsPlotX(m,i){return HS_PLOT.left+(i+.5)/m.count*(HS_PLOT.right-HS_PLOT.left)}
function hsPlotY(m,v){return HS_PLOT.bottom-v/m.top*(HS_PLOT.bottom-HS_PLOT.top)}
function hsGrowthY(m,v){return HS_PLOT.top+(m.rateLimit-v)/(m.rateLimit*2)*(HS_PLOT.bottom-HS_PLOT.top)}
function hsBarWidth(m){return Math.min(16,(HS_PLOT.right-HS_PLOT.left)/m.count*.72)}
function hsTrend(m){
 const {left,right,top,bottom}=HS_PLOT,barWidth=hsBarWidth(m),x=hsPlotX(m,m.point);
 const grid=[0,.5,1].map(f=>{
  const y=hsPlotY(m,m.top*f),rate=(f*2-1)*m.rateLimit;
  return '<line x1="'+left+'" y1="'+y+'" x2="'+right+'" y2="'+y+'" stroke="var(--line)" stroke-dasharray="3 5"/><text x="'+(left-8)+'" y="'+(y+4)+'" text-anchor="end">'+hsAxis(m.top*f)+'</text><text x="352" y="'+(y+4)+'" text-anchor="end">'+hsRateAxis(rate)+'</text>';
 }).join('');
 const ticks=m.mode==='year'?[0,2,5,8,11]:m.mode==='day'?[0,6,12,18,23]:[0,5,10,15,20,25,m.count-1];
 const labels=Array.from(new Set(ticks)).filter(i=>i<m.count).map(i=>'<text x="'+hsPlotX(m,i)+'" y="184" text-anchor="middle">'+(m.mode==='year'?(i+1)+'月':m.mode==='day'?i+'时':i+1)+'</text>').join('');
 const bars=m.currentValues.map((total,i)=>{
  if(total==null||total===0)return '';
  let accumulated=0;
  return m.categorySeries.map(c=>{
   const value=c.values[i]||0;if(value<=0)return '';
   const y1=hsPlotY(m,accumulated);accumulated+=value;const y2=hsPlotY(m,accumulated);
   return '<rect x="'+(hsPlotX(m,i)-barWidth/2).toFixed(3)+'" y="'+y2.toFixed(3)+'" width="'+barWidth.toFixed(3)+'" height="'+(y1-y2).toFixed(3)+'" fill="'+c.color+'"><title>'+esc(hsPointLabel(m,m.current,i)+' '+c.name+' '+money(value))+'</title></rect>';
  }).join('');
 }).join('');
 const segments=[];
 for(let i=1;i<m.count;i++){
  const a=m.growthValues[i-1],b=m.growthValues[i];if(a==null||b==null)continue;
  const x1=hsPlotX(m,i-1),x2=hsPlotX(m,i),y1=hsGrowthY(m,a),y2=hsGrowthY(m,b);
  if(a*b<0){
   const cross=x1+(x2-x1)*(-a/(b-a)),zero=hsGrowthY(m,0);
   segments.push({x1,y1,x2:cross,y2:zero,color:hsGrowthColor(a)},{x1:cross,y1:zero,x2,y2,color:hsGrowthColor(b)});
  }else segments.push({x1,y1,x2,y2,color:hsGrowthColor(a===0?b:a)});
 }
 const stroke=(segment,halo)=>'<line x1="'+segment.x1.toFixed(3)+'" y1="'+segment.y1.toFixed(3)+'" x2="'+segment.x2.toFixed(3)+'" y2="'+segment.y2.toFixed(3)+'" stroke="'+(halo?'var(--surface)':segment.color)+'" stroke-width="'+(halo?5:2.5)+'" stroke-linecap="round"/>';
 const line=segments.map(segment=>stroke(segment,true)).join('')+segments.map(segment=>stroke(segment,false)).join('');
 const dots=m.growthValues.map((rate,i)=>rate==null?'':'<circle cx="'+hsPlotX(m,i)+'" cy="'+hsGrowthY(m,rate)+'" r="2" fill="'+hsGrowthColor(rate)+'" stroke="var(--surface)" stroke-width="1"/>').join('');
 const selectedRate=m.growthValues[m.point],highlight='<rect id="hs-selected-bar" x="'+(x-barWidth/2-2)+'" y="'+top+'" width="'+(barWidth+4)+'" height="'+(bottom-top)+'" fill="var(--blue)" fill-opacity=".07"/>';
 const cursor='<line id="hs-trend-cursor" x1="'+x+'" x2="'+x+'" y1="'+top+'" y2="'+bottom+'" stroke="var(--muted)" stroke-opacity=".5" stroke-dasharray="2 4"/><circle id="hs-growth-point" cx="'+x+'" cy="'+hsGrowthY(m,selectedRate??0)+'" r="4" fill="var(--surface)" stroke="'+hsGrowthColor(selectedRate)+'" stroke-width="2" visibility="'+(selectedRate==null?'hidden':'visible')+'"/>';
 const svg='<svg viewBox="0 0 360 200" aria-hidden="true">'+grid+highlight+bars+'<line x1="'+left+'" y1="'+hsGrowthY(m,0)+'" x2="'+right+'" y2="'+hsGrowthY(m,0)+'" stroke="var(--muted)" stroke-opacity=".4" stroke-dasharray="3 5"/>'+line+dots+cursor+labels+'</svg>';
 const legend=m.categorySeries.length?'<div class="hs-stack-legend" aria-label="条形分类图例">'+m.categorySeries.map(c=>'<span class="hs-stack-key"><i aria-hidden="true" style="--hs-category-color:'+c.color+'"></i>'+esc(c.name)+'</span>').join('')+'</div>':'';
 return '<section class="card hs-card" aria-labelledby="hs-trend-heading"><div class="hs-heading"><h2 id="hs-trend-heading">'+typeLabels[m.type]+'趋势</h2></div><div class="hs-chart-legend"><span>'+esc(m.current.label)+' · 金额</span><span><i class="hs-swatch-rate" aria-hidden="true"></i>环比</span></div><div id="hs-trend-chart" class="hs-chart" data-chart="statistics" role="slider" tabindex="0" aria-label="'+typeLabels[m.type]+'分类堆积金额与环比增长率，左轴金额、右轴百分比，环比与上期对应时间点比较，左右方向键查看" aria-orientation="horizontal" aria-valuemin="0" aria-valuemax="'+Math.max(0,m.last)+'" aria-valuenow="'+m.point+'" aria-valuetext="'+esc(hsTrendAccessibleValue(m,m.point))+'">'+svg+'</div>'+legend+'<div id="hs-trend-readout" class="hs-point-readout" aria-live="polite" aria-atomic="true">'+hsPointReadout(m,m.point)+'</div></section>';
}

function syncHomeStatistics(){
 const chart=$('#hs-trend-chart',view);if(!chart)return;
 const m=hsModel(),readout=$('#hs-trend-readout',view),svg=$('svg',chart);let gesture=null;
 const select=index=>{
  const i=Math.max(0,Math.min(Math.max(0,m.last),index)),x=hsPlotX(m,i),rate=m.growthValues[i];U.statsPoint=i;
  const cursor=$('#hs-trend-cursor',chart);cursor.setAttribute('x1',x);cursor.setAttribute('x2',x);
  $('#hs-selected-bar',chart).setAttribute('x',x-hsBarWidth(m)/2-2);
  const dot=$('#hs-growth-point',chart);dot.setAttribute('cx',x);dot.setAttribute('visibility',rate==null?'hidden':'visible');dot.setAttribute('stroke',hsGrowthColor(rate));if(rate!=null)dot.setAttribute('cy',hsGrowthY(m,rate));
  readout.innerHTML=hsPointReadout(m,i);chart.setAttribute('aria-valuenow',i);chart.setAttribute('aria-valuetext',hsTrendAccessibleValue(m,i));
 };
 const point=e=>{
  // Transform through the SVG matrix so hit testing also fits narrow layouts.
  const matrix=svg.getScreenCTM();if(!matrix)return;
  const input=svg.createSVGPoint();input.x=e.clientX;input.y=e.clientY;
  const x=input.matrixTransform(matrix.inverse()).x;
  select(Math.round((x-HS_PLOT.left)/(HS_PLOT.right-HS_PLOT.left)*m.count-.5));
 };
 select(m.point);
 chart.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(e.key))return;e.preventDefault();e.stopPropagation();const now=Number(chart.getAttribute('aria-valuenow'));select(e.key==='Home'?0:e.key==='End'?m.last:now+(['ArrowRight','ArrowUp'].includes(e.key)?1:-1))});
 chart.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;gesture={id:e.pointerId,x:e.clientX,y:e.clientY,drag:false};point(e)});
 chart.addEventListener('pointermove',e=>{if(!gesture||gesture.id!==e.pointerId)return;const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;if(!gesture.drag){if(Math.abs(dy)>8&&Math.abs(dy)>Math.abs(dx)){gesture=null;return}if(Math.abs(dx)<8)return;gesture.drag=true;chart.setPointerCapture(e.pointerId)}point(e)});
 const finish=e=>{if(gesture?.id!==e.pointerId)return;gesture=null;if(chart.hasPointerCapture(e.pointerId))chart.releasePointerCapture(e.pointerId)};
 chart.addEventListener('pointerup',finish);chart.addEventListener('pointercancel',finish);chart.addEventListener('lostpointercapture',()=>{gesture=null});
}

}

function validatePlanConversations(data){

  if(p.conversation===undefined)continue;
  if(!Array.isArray(p.conversation)||p.conversation.length>10000)return '计划对话记录格式不正确';
  const ids=new Set();
  for(const m of p.conversation){
   if(!m||typeof m.id!=='string'||!/^[a-zA-Z0-9_-]{1,120}$/.test(m.id)||ids.has(m.id)||!['user','assistant'].includes(m.role)||typeof m.text!=='string'||!m.text.trim()||m.text.length>100000||!validDate(m.date)||typeof m.time!=='string'||!/^([01]\d|2[0-3]):[0-5]\d$/.test(m.time)||typeof m.at!=='string'||!Number.isFinite(Date.parse(m.at))||typeof m.threadId!=='string'||!/^[a-zA-Z0-9_-]{1,120}$/.test(m.threadId))return '计划对话记录包含无效的发言或时间';

}

function appendPlanConversation(p,records){
 const stored=p.conversation||(p.conversation=[]),seen=new Set(stored.map(m=>m.id));
 for(const m of records)if(m&&!seen.has(m.id)){if(stored.length>=10000)throw new Error('计划对话容量已满');stored.push(clone(m));seen.add(m.id)}
 stored.sort((a,b)=>a.at.localeCompare(b.at));
}
function flushPlanConversation(){
 const batches=new Map();
 for(const m of chat.messages){
  if(!m.planId)continue;const p=S.plans.find(x=>x.id===m.planId);if(!p||(p.conversation||[]).some(x=>x.id===m.id))continue;
  const record=planConversationRecord(m);if(!record)continue;
  if(!batches.has(p.id))batches.set(p.id,[]);batches.get(p.id).push(record);
 }
 if(!batches.size){chat.historyUnsaved=false;return true}
 const ok=commit(next=>{for(const [id,records]of batches){const p=next.plans.find(x=>x.id===id);if(p)appendPlanConversation(p,records)}},'',false,false,{deferRender:true});
 chat.historyUnsaved=!ok;if(ok&&U.route==='plan')render(false);return ok;
}

 const reply=p.status==='no'?'如果现有物品仍能满足需要，可以先等等，避免重复购买。':p.status==='bought'?'先确认实际需要，再核对付款金额与付款账户，购买计划和实际支付要分开记录。':'可以先明确用途和使用频率，再结合已登记的收支安排考虑。';
 const choice=p.status==='no'?'现有的还能满足需要，这次先不买了。':p.status==='bought'?'这次是日常所需，我已经购买，实际付款按账单记录。':'我再考虑一下，暂时先不买。';
 return [{role:'user',text:'我在考虑买「'+p.name+'」，'+price+'。'},{role:'assistant',text:reply},{role:'user',text:choice}].map((m,i)=>({...m,id:'example-'+p.id+'-'+i,date,time:'',at:'',threadId:'example-'+p.id,demo:true}));

let scrollFadeFrame=0;
function queueScrollFade(){
  cancelAnimationFrame(scrollFadeFrame);
  scrollFadeFrame=requestAnimationFrame(()=>{
    const main=U.route==='main';
    const tokens=getComputedStyle(document.documentElement);
    const topMax=Number(tokens.getPropertyValue('--scroll-fade-top-max'))||16;
    const bottomMax=Number(tokens.getPropertyValue('--scroll-fade-bottom-max'))||48;
    const remaining=Math.max(0,view.scrollHeight-view.clientHeight-view.scrollTop);
    const top=main?Math.min(topMax,Math.max(0,view.scrollTop)):0;
    const bottom=main?Math.min(bottomMax,remaining):0;
    view.style.setProperty('--scroll-fade-top',top+'px');
    view.style.setProperty('--scroll-fade-bottom',bottom+'px');
  });
}
function revealTabContent(){
  if(typeof view.animate!=='function')return;
  const active=view._tabReveal;
  const from=active&&active.playState==='running'?Number(getComputedStyle(view).opacity):.88;
  if(active)active.cancel();
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  view._tabReveal=view.animate([{opacity:from},{opacity:1}],{duration:180,easing:'ease-out'});
}
view.addEventListener('scroll',queueScrollFade,{passive:true});
window.addEventListener('resize',queueScrollFade,{passive:true});
if(typeof ResizeObserver==='function'){
  const scrollFadeObserver=new ResizeObserver(queueScrollFade);
  scrollFadeObserver.observe(view);
}


// The five routes share a three-position tab viewport; only user scrolling selects a page.
let mainTabRailState=null;
function mainTabRailTarget(nav,tab){const button=$('.app-tab[data-id="'+tab+'"]',nav);return button?Math.max(0,Math.min(nav.scrollWidth-nav.clientWidth,button.offsetLeft+button.offsetWidth/2-nav.clientWidth/2)):0}
function nearestMainTab(nav,projected=nav.scrollLeft){
 const middle=projected+nav.clientWidth/2;
 return $$('.app-tab',nav).reduce((best,button)=>!best||Math.abs(button.offsetLeft+button.offsetWidth/2-middle)<Math.abs(best.offsetLeft+best.offsetWidth/2-middle)?button:best,null);
}
function disposeMainTabRail(){const state=mainTabRailState;if(!state)return;state.disposed=true;clearTimeout(state.timer);cancelAnimationFrame(state.frame);state.resize?.disconnect();mainTabRailState=null}
function positionMainTabRail(state){
 if(state.disposed||!state.nav.isConnected||state.held)return;
 state.armed=false;clearTimeout(state.timer);state.nav.scrollTo({left:mainTabRailTarget(state.nav,U.tab),behavior:'auto'});
}
function settleMainTabRail(state){
 if(state.disposed||mainTabRailState!==state||!state.nav.isConnected||state.held||!state.armed||U.route!=='main')return;
 const button=nearestMainTab(state.nav);if(!button)return;
 state.armed=false;
 if(button.dataset.id!==U.tab){switchTab(button.dataset.id);return}
 state.nav.scrollTo({left:mainTabRailTarget(state.nav,U.tab),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
}
function queueMainTabSettle(state){clearTimeout(state.timer);if(!state.disposed)state.timer=setTimeout(()=>settleMainTabRail(state),160)}
function syncMainTabRail(){
 const nav=$('.app-tabs');if(!nav)return;
 const state={nav,armed:false,held:false,drag:null,timer:0,frame:0,resize:null,width:0,suppressClickUntil:0,disposed:false};mainTabRailState=state;
 nav.addEventListener('scroll',()=>{if(state.armed)queueMainTabSettle(state)},{passive:true});
 nav.addEventListener('wheel',()=>{state.armed=true;queueMainTabSettle(state)},{passive:true});
 nav.addEventListener('pointerdown',e=>{
  if(!e.isPrimary||e.button!==0)return;state.armed=true;state.held=true;clearTimeout(state.timer);
  // Stop an unfinished programmatic scroll at its current visible position.
  const current=nav.scrollLeft;nav.scrollTo({left:current,behavior:'auto'});
  if(e.pointerType==='mouse')state.drag={id:e.pointerId,x:e.clientX,y:e.clientY,scroll:current,scale:nav.getBoundingClientRect().width/nav.clientWidth||1,lastX:e.clientX,lastTime:e.timeStamp,velocity:0,moved:false};
 });
 nav.addEventListener('pointermove',e=>{
  const d=state.drag;if(!d||d.id!==e.pointerId||state.disposed)return;const dx=(e.clientX-d.x)/d.scale,dy=(e.clientY-d.y)/d.scale;
  if(!d.moved){if(Math.abs(dy)>8&&Math.abs(dy)>Math.abs(dx)){state.drag=null;state.held=false;return}if(Math.abs(dx)<8)return;d.moved=true;nav.setPointerCapture(e.pointerId);nav.classList.add('main-tabs-dragging')}

const SUBSCRIPTION_SERVICES={"tencent-video":"腾讯视频","iqiyi":"爱奇艺视频","bilibili":"哔哩哔哩","netease-music":"网易云音乐","qishui-music":"汽水音乐","qq-music":"QQ音乐","apple-tv":"Apple TV","apple-music":"Apple Music","netflix":"Netflix","custom":"自定义订阅"};
function subscriptionServiceName(id,data=S){
 const saved=(data.settings.subscriptionServices||[]).find(service=>service.id===id);
 return saved?.name||SUBSCRIPTION_SERVICES[id]||'自定义订阅';
}
function subscriptionServiceCatalog(data=S){
 const entries=data.settings.subscriptionServices||[],ids=[...SUBSCRIPTION_DEFAULT_IDS];
 for(const entry of entries)if(!ids.includes(entry.id))ids.push(entry.id);
 for(const record of data.recurring.filter(r=>r.subscription===true)){
  const id=knownSubscriptionService(record.service,data)?record.service:'custom';
  if(!ids.includes(id))ids.push(id);
 }
 return ids.map(id=>({id,name:subscriptionServiceName(id,data),color:entries.find(entry=>entry.id===id)?.color||'default',custom:!Object.prototype.hasOwnProperty.call(SUBSCRIPTION_SERVICES,id)}));
}
function subscriptionPalette(color,service=''){
 const base=SUBSCRIPTION_CARD_PALETTES.find(p=>p.id===(SUBSCRIPTION_DEFAULT_COLORS[service]||'blue'));
 const original={'apple-tv':'var(--sub-tv-gradient)','apple-music':'var(--sub-music-gradient)',netflix:'var(--sub-netflix-gradient)'};
 const background=SUBSCRIPTION_DEFAULT_IDS.includes(service)?base.background:(original[service]||'var(--sub-custom-gradient)');
 const defaultPalette={id:'default',name:'默认',background};
 return color==='default'?defaultPalette:SUBSCRIPTION_CARD_PALETTES.find(p=>p.id===color)||defaultPalette;
}
function subscriptionCardStyle(record){
 if(!record?.service)return '';
 const saved=(S.settings.subscriptionServices||[]).find(service=>service.id===record.service),color=saved?.color||'default';
 if(!saved&&!SUBSCRIPTION_DEFAULT_IDS.includes(record.service))return '';
 return 'background:'+subscriptionPalette(color,record.service).background;
}
function subscriptionManagementPage(){
 const services=subscriptionServiceCatalog();
 return '<section class="card flush">'+services.map(service=>{
  const palette=subscriptionPalette(service.color,service.id);
  return '<button type="button" class="list-row sub-manage-row" data-action="sub-service-edit" data-id="'+esc(service.id)+'" aria-label="编辑'+esc(service.name)+'的订阅样式"><span class="sub-manage-card od-fixed" style="background:'+esc(palette.background)+'" aria-hidden="true"><span class="sub-brand">'+subscriptionBrand({service:service.id})+'</span></span><span class="od-field od-fill"><strong class="od-truncate">'+esc(service.name)+'</strong><small class="muted">'+(service.custom?'自定义 · ':'')+esc(palette.name)+'色卡</small></span>'+icon('right')+'</button>';
 }).join('')+'</section>'+button('添加服务','sub-service-new','','primary',S.readOnly?'disabled':'');
}
function openSubscriptionService(id=''){
 if(S.readOnly){toast('当前账本只读，请先恢复有效数据');return}
 const service=id?subscriptionServiceCatalog().find(item=>item.id===id):null;
 if(id&&!service){toast('订阅服务不存在');return}
 const color=service?.color||'default',name=service?.name||'',fixed=service&&!service.custom;
 const options=[subscriptionPalette('default',id),...SUBSCRIPTION_CARD_PALETTES];
 const body=field('name','订阅名称',name,'text',{required:true,attrs:'maxlength="40" autocomplete="off"'+(fixed?' readonly':'')})+
  '<div class="sub-style-preview od-stack" data-sub-style-preview style="background:'+esc(subscriptionPalette(color,id).background)+'"><div class="od-row"><span class="sub-brand od-fixed">'+subscriptionBrand({service:id})+'</span><strong class="od-fill" data-sub-style-name>'+esc(name||'订阅名称')+'</strong></div><span>卡片预览</span></div>'+
  '<section class="sub-style-field od-stack"><div class="od-row"><span class="od-fill" id="sub-style-color-label">卡片色卡</span><span class="muted" data-sub-style-color-name>'+esc(subscriptionPalette(color,id).name)+'</span></div><input type="hidden" id="f-cardColor" name="cardColor" value="'+esc(color)+'"><div class="sub-style-colors" role="radiogroup" aria-labelledby="sub-style-color-label">'+options.map(option=>'<button type="button" class="sub-style-color" role="radio" aria-checked="'+(color===option.id)+'" tabindex="'+(color===option.id?'0':'-1')+'" data-action="sub-service-color" data-value="'+option.id+'" aria-label="'+esc(option.name)+'色卡"><span class="sub-style-swatch" style="background:'+esc(option.background)+'" aria-hidden="true">'+icon('check')+'</span><span>'+esc(option.name)+'</span></button>').join('')+'</div><span class="field-error" id="err-cardColor" aria-live="polite"></span></section>';
 openForm(service?'订阅样式':'添加订阅服务','subscription-service',body,'保存',id,{},'subscription-service:'+(id||'new'));
 syncSubscriptionServiceForm($('form[data-form="subscription-service"]',overlay));
}
function syncSubscriptionServiceForm(form){
 if(!form||form.dataset.form!=='subscription-service')return;
 const input=form.elements.namedItem('cardColor'),palette=subscriptionPalette(input.value,form.dataset.id);input.value=palette.id;
 $('[data-sub-style-preview]',form).style.background=palette.background;
 $('[data-sub-style-name]',form).textContent=form.elements.namedItem('name').value.trim()||'订阅名称';
 $('[data-sub-style-color-name]',form).textContent=palette.name;
 $$('[data-action="sub-service-color"]',form).forEach(button=>{const selected=button.dataset.value===palette.id;button.setAttribute('aria-checked',String(selected));button.tabIndex=selected?0:-1});
 if(form._subscriptionStyleBound)return;
 form._subscriptionStyleBound=true;
 form.addEventListener('input',()=>syncSubscriptionServiceForm(form));
 form.addEventListener('keydown',event=>{
  const button=event.target.closest('[data-action="sub-service-color"]');
  if(!button||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(event.key))return;
  event.preventDefault();event.stopPropagation();
  const buttons=$$('[data-action="sub-service-color"]',form),index=buttons.indexOf(button),next=event.key==='Home'?0:event.key==='End'?buttons.length-1:(index+(['ArrowRight','ArrowDown'].includes(event.key)?1:buttons.length-1))%buttons.length;
  selectSubscriptionServiceColor(buttons[next]);buttons[next].focus({preventScroll:true});
 });
}
function selectSubscriptionServiceColor(button){
 const form=button?.closest('form[data-form="subscription-service"]');if(!form)return;
 const value=button.dataset.value;if(value!=='default'&&!SUBSCRIPTION_CARD_PALETTES.some(p=>p.id===value))return;
 form.elements.namedItem('cardColor').value=value;fieldError(form,'cardColor','');syncSubscriptionServiceForm(form);stashDraft();
}
function saveSubscriptionService(form,data,id){
 const old=id?subscriptionServiceCatalog().find(service=>service.id===id):null;
 if(id&&!old)return formFail(form,'服务已不存在，请返回列表重新选择');
 const name=old&&!old.custom?old.name:String(data.name||'').trim();
 if(!name||name.length>40)return formFail(form,'请填写1至40个字符的订阅名称','name');
 const normalize=value=>String(value).replace(/\s+/g,'').toLowerCase();
 const names=[...Object.entries(SUBSCRIPTION_SERVICES).map(([id,name])=>({id,name})),...subscriptionServiceCatalog()];
 if(names.some(service=>service.id!==id&&normalize(service.name)===normalize(name))||id!=='iqiyi'&&normalize(name)==='爱奇艺')return formFail(form,'已有同名订阅服务，请使用不同名称','name');
 if(data.cardColor!=='default'&&!SUBSCRIPTION_CARD_PALETTES.some(p=>p.id===data.cardColor))return formFail(form,'请选择有效的卡片色卡','cardColor');
 const entries=S.settings.subscriptionServices||[];
 if(!entries.some(service=>service.id===id)&&entries.length>=1000)return formFail(form,'服务数量已达上限，请编辑已有服务');
 const savedId=id||uid('sub-service');
 const ok=commit(next=>{
  next.settings.subscriptionServices=[...(next.settings.subscriptionServices||[]).filter(service=>service.id!==savedId),{id:savedId,name,color:data.cardColor}];
  if(old&&old.custom&&old.name!==name)for(const record of next.recurring)if(record.subscription===true&&record.service===savedId&&record.name===old.name)record.name=name;
 },old?'订阅样式已保存':'订阅服务已添加');
 if(ok){delete drafts[overlayState?.draftKey];closeSheet(true)}else formFail(form,'未能保存，请按提示处理后重试，当前输入已保留。');
}
let subscriptionRailState=null;
function ensureLifeDemoData(data){
 if(!data.sample||data.readOnly||data.settings.lifeDemoVersion===1)return data;
 const date=currentLocalStamp().date.slice(0,7)+'-01';
 const examples=[
 ['property','物业费',30000,'housing','monthly'],['utilities','水电费',18000,'housing','monthly'],
 ['tuition','学费',120000,'education','monthly'],['books','教材费',18000,'education','quarterly'],
 ['insurance','健康保险',360000,'health','yearly'],['care','健康护理',15000,'health','monthly'],
 ['commute','通勤月卡',20000,'other','monthly'],['mobile','通讯套餐',8000,'other','monthly']
 ];
 for(const [key,name,amount,lifeCategory,frequency] of examples){
  const id='life-demo-'+key;if(data.recurring.some(r=>r.id===id))continue;
  data.recurring.push({id,name,amount,lifeCategory,frequency,type:'expense',category:lifeCategory==='housing'?'housing':'other',account:'',date,paused:false,endDate:'',remind:false,subscription:false,demoLife:true});
 }
 data.settings.lifeDemoVersion=1;return data;

function ensureSubscriptionData(data){
 if(!data.sample||data.readOnly||data.settings.subscriptionDemoVersion===1)return data;
 const today=currentLocalStamp().date;
 const samples=[['apple-tv','Apple TV',2500,3],['apple-music','Apple Music',1200,7],['netflix','Netflix',3000,12]];
 for(const [service,name,amount,offset]of samples){

function lifeBadgeLayout(entries){

  const options=[],seen=new Set();
  for(const offset of [0,-.16,.16,-.32,.32,-.52,.52,-.8,.8,-1.1,1.1,-1.5,1.5])for(const radius of [134,146]){
   const angle=e.angle+offset,box={x:clamp(160+radius*Math.cos(angle)-width/2,4,316-width),y:clamp(160+radius*Math.sin(angle)-height/2,4,316-height),width,height};
   const key=Math.round(box.x)+':'+Math.round(box.y);if(seen.has(key)||overlaps(box,center))continue;seen.add(key);options.push(box);
  }

async function fingerprintDemoImage(file){
 const bytes=new Uint8Array(await file.arrayBuffer());
 if(globalThis.crypto?.subtle){const digest=await crypto.subtle.digest('SHA-256',bytes);return Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('')}
 let hash=2166136261;for(const byte of bytes)hash=Math.imul(hash^byte,16777619);return 'demo-'+bytes.length+'-'+(hash>>>0).toString(16);
}

async function runImageDemo(task){
 clearTimeout(task.timer);task.cancelled=false;const token=uid('run');task.token=token;
 setImageDemoState(task,'reading','仅在当前页面读取图片预览。',12);
 try{
  task.url=task.url||URL.createObjectURL(task.file);
  const image=new Image();image.src=task.url;
  let timeout;
  try{await Promise.race([image.decode(),new Promise((_,reject)=>timeout=setTimeout(()=>reject(Error('图片读取超时，请重新选择。')),10000))])}finally{clearTimeout(timeout)}
  if(task.token!==token||task.cancelled)return;
  task.width=image.naturalWidth;task.height=image.naturalHeight;
  if(!task.width||!task.height||task.width*task.height>32000000)throw Error('图片尺寸过大，请选择较小的图片。');
  task.fingerprint=task.fingerprint||await fingerprintDemoImage(task.file);
  if(task.token!==token||task.cancelled)return;
  setImageDemoState(task,'recognizing','正在演示图片识别与记账流程…',40);
  task.timer=setTimeout(()=>{
   if(task.token!==token||task.cancelled)return;
   setImageDemoState(task,'recognizing','正在生成预设示例账单…',80);
   task.timer=setTimeout(()=>completeImageDemo(task,token),500);
  },650);
 }catch(error){if(task.token===token&&!task.cancelled)setImageDemoState(task,'error',error.message||'无法读取图片，请选择PNG、JPG或WebP图片。',0)}
}

function clearAIPress(){
 const press=aiPress;aiPress=null;
 if(press)clearTimeout(press.timer);
 dockAI?.classList.remove('voice-pressing');
 if(press?.pointerId!=null){try{if(dockAI.hasPointerCapture(press.pointerId))dockAI.releasePointerCapture(press.pointerId)}catch(e){}}
 return press;
}
function beginAIPress(event,keyboard=false){
 if(aiPress||activeVoice||overlayState)return;
 const rect=dockAI.getBoundingClientRect();
 const press={keyboard,pointerId:keyboard?null:event.pointerId,x:event.clientX||0,y:event.clientY||0,scale:rect.width/dockAI.offsetWidth||1,long:false,abandoned:false,timer:null};
 aiPress=press;dockAI.classList.add('voice-pressing');
 press.timer=setTimeout(()=>{
  if(aiPress!==press||press.abandoned)return;
  press.long=true;aiSuppressClickUntil=Infinity;
  startVoiceInput({origin:'dock',hold:true});
 },AI_VOICE_HOLD_MS);
}
function endAIPress(cancel=false){
 const press=clearAIPress();if(!press)return;
 if(press.long||press.abandoned||cancel)aiSuppressClickUntil=performance.now()+800;
 if(press.long){
  if(activeVoice?.hold){if(cancel||activeVoice.cancelIntent)cancelVoiceInput(false);else finishVoiceInput()}
 }else if(press.keyboard&&!press.abandoned&&!cancel)showAI();
}
function bindAIVoiceEntry(){
 if(!dockAI)return;

  if(!event.isPrimary||event.button!==0)return;
  beginAIPress(event);
  if(aiPress){try{dockAI.setPointerCapture(event.pointerId)}catch(e){}}
 });
 document.addEventListener('pointermove',event=>{
  const press=aiPress;if(!press||press.keyboard||event.pointerId!==press.pointerId)return;
  const dx=(event.clientX-press.x)/press.scale,dy=(event.clientY-press.y)/press.scale;
  if(!press.long){
   if(Math.hypot(dx,dy)>12){clearTimeout(press.timer);press.abandoned=true;dockAI.classList.remove('voice-pressing')}
   return;
  }
  const session=activeVoice;
  if(session?.hold&&!session.wantSend){
   session.cancelIntent=dy<-AI_VOICE_CANCEL_PX||Math.abs(dx)>96;
   paintVoiceStatus(session,session.cancelIntent?'cancel':session.ended?'ready':session.started?'listening':'preparing');
  }
 },true);
 document.addEventListener('pointerup',event=>{if(aiPress&&!aiPress.keyboard&&event.pointerId===aiPress.pointerId)endAIPress(false)},true);
 document.addEventListener('pointercancel',event=>{if(aiPress&&!aiPress.keyboard&&event.pointerId===aiPress.pointerId)endAIPress(true)},true);
 dockAI.addEventListener('click',event=>{
  if(performance.now()<aiSuppressClickUntil){event.preventDefault();event.stopImmediatePropagation()}
 },true);
 dockAI.addEventListener('contextmenu',event=>event.preventDefault());
 dockAI.addEventListener('keydown',event=>{
  if(event.code!=='Space'||event.repeat)return;
  event.preventDefault();beginAIPress(event,true);
 });
 document.addEventListener('keyup',event=>{
  if(event.code==='Space'&&aiPress?.keyboard){event.preventDefault();endAIPress(false)}
 },true);
 document.addEventListener('visibilitychange',()=>{
  if(document.hidden){endAIPress(true);if(activeVoice){disposeVoice(activeVoice);closeSheet(true)}}
 });
 window.addEventListener('pagehide',()=>{clearAIPress();if(activeVoice)disposeVoice(activeVoice)});
 window.addEventListener('blur',()=>{if(aiPress&&!aiPress.long)endAIPress(true)});
}

  const day=e.target.closest('[data-action="home-day"]');if(!day||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();e.stopPropagation();
  const index=e.key==='Home'?0:e.key==='End'?model.count-1:homeBucketIndex(model,day.dataset.id)+(e.key==='ArrowRight'?1:-1);selectHomeDate(homeBucketDate(model,Math.max(0,Math.min(model.count-1,index))),true);
 });
 if(typeof ResizeObserver==='function'){state.resize=new ResizeObserver(()=>{paint()});state.resize.observe(rail)}
}

let swipe=null,swipeFrame=0;
view.addEventListener('pointerdown',e=>{if(overlayState||U.route!=='main'||e.target.closest('button,a,input,select,textarea,.od-rail,[data-chart],.calendar,[data-subscription-stage],.cash-wallet,.item-honey-shell'))return;const rect=view.getBoundingClientRect();if(e.clientX-rect.left<24||rect.right-e.clientX<24)return;cancelAnimationFrame(swipeFrame);swipe={baseX:view._swipeX||0,scale:rect.width/view.clientWidth||1,id:e.pointerId,startX:e.clientX,startY:e.clientY,lastX:e.clientX,time:e.timeStamp,dx:0,v:0,committed:false,rejected:false}});
view.addEventListener('pointermove',e=>{if(!swipe||e.pointerId!==swipe.id)return;const dx=(e.clientX-swipe.startX)/swipe.scale+swipe.baseX,dy=e.clientY-swipe.startY;if(!swipe.committed){if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){swipe.rejected=true;return}if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.5&&!swipe.rejected){swipe.committed=true;view.setPointerCapture(e.pointerId)}else return}const dt=Math.max(1,e.timeStamp-swipe.time);swipe.v=(e.clientX-swipe.lastX)/dt*1000/swipe.scale;swipe.lastX=e.clientX;swipe.time=e.timeStamp;const ids=MAIN_TAB_IDS,idx=ids.indexOf(U.tab);swipe.dx=(idx===0&&dx>0||idx===ids.length-1&&dx<0)?dx*.18:Math.max(-140,Math.min(140,dx));view._swipeX=swipe.dx;if(!matchMedia('(prefers-reduced-motion: reduce)').matches)view.style.transform='translateX('+swipe.dx+'px)'});
function settleSwipe(x,v){cancelAnimationFrame(swipeFrame);if(matchMedia('(prefers-reduced-motion: reduce)').matches){view.style.transform='';view._swipeX=0;return}let previous=performance.now(),start=previous;function tick(now){const dt=Math.min(.024,(now-previous)/1000);previous=now;v+=(-460*x-43*v)*dt;x+=v*dt;view._swipeX=x;view.style.transform='translateX('+x+'px)';if((Math.abs(x)<.3&&Math.abs(v)<2)||now-start>300){view._swipeX=0;view.style.transform=''}else swipeFrame=requestAnimationFrame(tick)}swipeFrame=requestAnimationFrame(tick)}
function finishSwipe(cancel=false){if(!swipe)return;const s=swipe;swipe=null;if(!cancel&&s.committed){const projected=s.dx+s.v*.12;if(Math.abs(projected)>70){const ids=MAIN_TAB_IDS,next=ids.indexOf(U.tab)+(projected<0?1:-1);if(next>=0&&next<ids.length)switchTab(ids[next])}}settleSwipe(s.dx,s.v)}
view.addEventListener('pointerup',()=>finishSwipe());view.addEventListener('pointercancel',()=>finishSwipe(true));
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue!==lastRaw)toast('另一个窗口更新了账本。请先保留草稿，再刷新查看最新记录。')});
try{const saved=sessionStorage.getItem(KEY+'.drafts');if(saved){const d=JSON.parse(saved);if(d&&typeof d==='object'&&!Array.isArray(d))Object.assign(drafts,d)}}catch(e){}
const initialRoute=location.hash.replace(/^#\//,'').split('/');if(MAIN_TAB_IDS.includes(initialRoute[0]))U.tab=initialRoute[0];else if(initialRoute[0]==='recurring-history')U.route='recurring-history';else if(initialRoute[0]==='category-budget'){U.route='category-budget';U.id=initialRoute[1]||'';U.cbCategory=U.id;}else if(initialRoute[0]==='stats-bills'){const c=HS_CATEGORIES.find(c=>c.id===initialRoute[1]);if(c){U.route='stats-bills';U.id=c.id;U.statsCategory=c.id;U.statsType=c.entryType}}else if(initialRoute[0]==='stats-transaction'){const t=HS_TRANSACTIONS.find(t=>t.id===initialRoute[1]);if(t){U.route='stats-transaction';U.id=t.id;U.statsCategory=t.category;U.statsType=t.type}}
function fitKeyboard(){if(!window.visualViewport)return;const editing=overlayState&&['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName);const gap=matchMedia('(max-width:480px)').matches&&editing?Math.max(0,window.innerHeight-window.visualViewport.height-window.visualViewport.offsetTop):0;overlay.style.bottom='calc(var(--phone-safe-bottom) + '+gap+'px)';if(editing)document.activeElement.scrollIntoView({block:'nearest',behavior:'auto'})}
window.visualViewport?.addEventListener('resize',fitKeyboard);document.addEventListener('focusin',fitKeyboard);
bindAIVoiceEntry();
render(true);updateHash();
})();
